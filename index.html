<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Widget</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: white;
            height: 100vh;
            box-sizing: border-box;
        }

        #time {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #date {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #focus-container {
            text-align: center;
        }

        #focus-timer {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #focus-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .timer-button {
            background-color: #61dafb;
            color: #282c34;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .timer-button:hover {
            background-color: #21a1f1;
        }
    </style>
</head>
<body>
    <div id="time"></div>
    <div id="date"></div>

    <div id="focus-container">
        <div id="focus-timer">00:00</div>
        <div id="focus-controls">
            <button class="timer-button" onclick="startFocusTimer(15)">15 Phút</button>
            <button class="timer-button" onclick="startFocusTimer(30)">30 Phút</button>
            <button class="timer-button" onclick="startFocusTimer(60)">60 Phút</button>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }

        function updateDate() {
            const now = new Date();
            const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); // Tháng bắt đầu từ 0
            const year = now.getFullYear();

            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const pastDaysOfYear = (now - startOfYear + 86400000) / 86400000;
            const weekNumber = Math.ceil(pastDaysOfYear / 7);

            document.getElementById('date').textContent = `${dayName}, ${day}/${month}/${year}, Tuần ${weekNumber}`;
        }

        let focusInterval;
        function startFocusTimer(minutes) {
            clearInterval(focusInterval);
            let seconds = minutes * 60;
            const focusTimerElement = document.getElementById('focus-timer');

            focusInterval = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                focusTimerElement.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (seconds > 0) {
                    seconds--;
                } else {
                    clearInterval(focusInterval);
                    focusTimerElement.textContent = "Đã Hết Giờ!";
                    setTimeout(() => {
                        focusTimerElement.textContent = "00:00";
                    }, 3000);
                }
            }, 1000);
        }

        updateTime();
        updateDate();
        setInterval(updateTime, 1000);
        setInterval(updateDate, 60000); // Cập nhật ngày mỗi phút
    </script>
</body>
</html>
